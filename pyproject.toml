[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codex-usage-hud"
dynamic = ["version"]
description = "Local-first real-time token HUD and cost tracker for Codex App usage with accurate cached token pricing."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "codex-usage-hud contributors" },
]
dependencies = []
keywords = [
  "Codex App token usage",
  "Codex usage tracker",
  "real-time token HUD",
  "cost tracker",
  "cached token cost",
  "local-first privacy",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Monitoring",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/mingbingfeng/codex-usage-hud"
Repository = "https://github.com/mingbingfeng/codex-usage-hud"
Documentation = "https://github.com/mingbingfeng/codex-usage-hud/tree/main/docs"
Changelog = "https://github.com/mingbingfeng/codex-usage-hud/blob/main/CHANGELOG.md"
Contributing = "https://github.com/mingbingfeng/codex-usage-hud/blob/main/CONTRIBUTING.md"
Privacy = "https://github.com/mingbingfeng/codex-usage-hud/blob/main/docs/PRIVACY.md"
Issues = "https://github.com/mingbingfeng/codex-usage-hud/issues"
Description = "https://github.com/mingbingfeng/codex-usage-hud#readme"

[project.scripts]
codex-hud = "codex_usage_hud.cli:main"

[tool.hatch.version]
path = "src/codex_usage_hud/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_usage_hud"]

[tool.hatch.build.targets.wheel.force-include]
"src/codex_usage_hud/assets/sponsor_alipay.jpg" = "codex_usage_hud/assets/sponsor_alipay.jpg"
"src/codex_usage_hud/assets/sponsor_wechat.jpg" = "codex_usage_hud/assets/sponsor_wechat.jpg"
