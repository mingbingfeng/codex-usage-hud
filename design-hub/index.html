<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>豆包方案 · 方案聚合导航</title>
<style>
  :root{
    --bg:#0A0F14; --card:#10161D; --panel:#141B24; --line:#263241; --line2:#1B2634;
    --text:#D7E1EE; --text2:#A9B6C6; --text3:#8492A6; --text4:#5B6B7F;
    --acc-tool:#9CCBFF; --acc-toolbg:#0D1722;
    --acc-run:#F3D27A; --acc-runbg:#1C190F;
    --mono:"Consolas","Cascadia Code","SF Mono",monospace;
    --sans:"Microsoft YaHei UI","Segoe UI","PingFang SC",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;display:flex;flex-direction:column;overflow:hidden}

  /* ---------- header ---------- */
  .topbar{display:flex;align-items:center;gap:14px;padding:12px 18px;background:#0D131A;border-bottom:1px solid var(--line2);flex:0 0 auto}
  .logo{width:30px;height:30px;border-radius:8px;background:var(--acc-toolbg);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:13px;color:var(--acc-tool);font-weight:700}
  .topbar h1{font-size:16px;font-weight:700;letter-spacing:.3px}
  .topbar h1 .tag{display:inline-block;font-size:10px;font-weight:600;color:#0A0F14;background:var(--acc-tool);border-radius:4px;padding:1px 7px;vertical-align:2px;margin-left:8px}
  .topbar .spacer{flex:1}
  .back{background:var(--card);border:1px solid var(--line);color:var(--text2);border-radius:7px;padding:6px 13px;font-size:12.5px;cursor:pointer;font-family:var(--sans);transition:.12s}
  .back:hover{border-color:#3A4A5E;color:var(--text)}
  .now{font-size:12px;color:var(--text3);font-family:var(--mono)}

  /* ---------- body ---------- */
  .body{display:flex;flex:1 1 auto;min-height:0}

  /* sidebar */
  .side{width:292px;flex:0 0 auto;background:#0D131A;border-right:1px solid var(--line2);padding:14px 12px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
  .side .hint{font-size:11px;color:var(--text4);padding:0 6px 4px;letter-spacing:.4px}
  .card{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 12px;cursor:pointer;transition:.13s;font-family:var(--sans)}
  .card:hover{border-color:#3A4A5E;transform:translateY(-1px)}
  .card.on{background:var(--acc-toolbg);border-color:var(--acc-tool);box-shadow:0 0 0 1px var(--acc-tool) inset}
  .card .row1{display:flex;align-items:center;gap:8px}
  .card .idx{font-family:var(--mono);font-size:10px;font-weight:700;color:var(--text3);border:1px solid var(--line);border-radius:5px;padding:1px 5px;flex:0 0 auto}
  .card.on .idx{color:var(--acc-tool);border-color:var(--acc-tool)}
  .card .name{font-size:13px;font-weight:600;color:var(--text);line-height:1.35;flex:1}
  .card .badge{font-size:10px;font-weight:600;color:var(--acc-run);background:var(--acc-runbg);border-radius:4px;padding:1px 6px;flex:0 0 auto;white-space:nowrap}
  .card .src{margin-top:7px;font-family:var(--mono);font-size:10.5px;color:var(--text4);word-break:break-all;line-height:1.5;border-top:1px dashed var(--line2);padding-top:7px}

  /* viewport */
  .view{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
  .frame-wrap{flex:1 1 auto;min-height:0;padding:14px}
  iframe{width:100%;height:100%;border:1px solid var(--line);border-radius:12px;background:#0A0F14;display:block}
  .statusbar{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:8px 18px;background:#0D131A;border-top:1px solid var(--line2);font-size:11.5px;color:var(--text4)}
  .statusbar .dot{width:7px;height:7px;border-radius:50%;background:var(--acc-tool);box-shadow:0 0 6px var(--acc-tool)}
  .statusbar .label{color:var(--text2);font-weight:600}
  .statusbar .url{font-family:var(--mono);color:var(--text4);word-break:break-all}

  @media(max-width:860px){
    .body{flex-direction:column}
    .side{width:100%;flex-direction:row;flex-wrap:wrap;border-right:none;border-bottom:1px solid var(--line2);gap:8px}
    .side .hint{display:none}
    .card{flex:1 1 45%;min-width:200px}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="logo">豆包</div>
  <h1>豆包方案<span class="tag">聚合导航</span></h1>
  <div class="spacer"></div>
  <button class="back" id="backBtn" title="返回默认展示：豆包方案">← 返回首页</button>
  <span class="now" id="nowLabel"></span>
</header>

<div class="body">
  <aside class="side">
    <div class="hint">会话气泡「执行状态」方案集 · 同页导航</div>
    <button class="card on" data-idx="01" data-src="./main.html">
      <span class="row1"><span class="idx">01</span><span class="name">豆包方案</span><span class="badge">当前 · 默认</span></span>
      <span class="src">./main.html</span>
    </button>
    <button class="card" data-idx="02" data-src="./hy4-preview.html">
      <span class="row1"><span class="idx">02</span><span class="name">Hy4 preview方案</span></span>
      <span class="src">./hy4-preview.html</span>
    </button>
    <button class="card" data-idx="03" data-src="./ds-v4-flash.html">
      <span class="row1"><span class="idx">03</span><span class="name">ds-v4-flash（微信小程序开发大赛免费）</span></span>
      <span class="src">./ds-v4-flash.html</span>
    </button>
    <button class="card" data-idx="04" data-src="./glm-5.3-flash.html">
      <span class="row1"><span class="idx">04</span><span class="name">GLM-5.3-Flash试用版</span></span>
      <span class="src">./glm-5.3-flash.html</span>
    </button>
    <button class="card" data-idx="05" data-src="./gpt-5.6-sol.html">
      <span class="row1"><span class="idx">05</span><span class="name">gpt-5.6-sol</span></span>
      <span class="src">./gpt-5.6-sol.html</span>
    </button>
  </aside>

  <div class="view">
    <div class="frame-wrap">
      <iframe id="frame" src="./main.html" title="方案预览"></iframe>
    </div>
    <footer class="statusbar">
      <span class="dot"></span>
      <span>当前展示：</span><span class="label" id="statusName">豆包方案</span>
      <span class="url" id="statusUrl">./main.html</span>
    </footer>
  </div>
</div>

<script>
(function(){
  var cards = Array.prototype.slice.call(document.querySelectorAll('.card'));
  var frame = document.getElementById('frame');
  var statusName = document.getElementById('statusName');
  var statusUrl = document.getElementById('statusUrl');
  var nowLabel = document.getElementById('nowLabel');

  function select(card, push){
    cards.forEach(function(c){ c.classList.remove('on'); });
    card.classList.add('on');
    var src = card.getAttribute('data-src');
    frame.src = src;
    var name = card.querySelector('.name').textContent;
    statusName.textContent = name;
    statusUrl.textContent = src;
    nowLabel.textContent = name;
    if (push && history.replaceState) {
      try { history.replaceState(null, '', '#idx=' + card.getAttribute('data-idx')); } catch(e){}
    }
  }

  cards.forEach(function(card){
    card.addEventListener('click', function(){ select(card, true); });
  });

  // 返回首页 = 切回默认的豆包方案
  document.getElementById('backBtn').addEventListener('click', function(){
    var first = cards[0];
    if (!first.classList.contains('on')) select(first, true);
    else frame.contentWindow && frame.contentWindow.location.reload && frame.contentWindow.location.reload();
  });

  // 依据 URL hash 恢复上次视图
  var m = /idx=(\d+)/.exec(location.hash);
  if (m){
    var target = cards.filter(function(c){ return c.getAttribute('data-idx') === m[1]; })[0];
    if (target) select(target, false);
  }
})();
</script>
</body>
</html>
