      <text x="202" y="252" class="value mono">$3.08</text>
      <text x="202" y="273" class="muted">会话金额</text>
      <text x="340" y="252" class="value2 mono">2.95M</text>
      <text x="342" y="273" class="muted">累计 tokens</text>
      <rect x="440" y="228" width="74" height="26" rx="13" fill="#1C2330" stroke="#334153"/>
