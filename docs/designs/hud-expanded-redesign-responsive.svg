      <text x="396" y="312" class="accent mono" font-size="12" font-weight="700">估算 $0.088</text>
      <rect x="202" y="333" width="70" height="28" rx="6" fill="#101821" stroke="#273241"/>
      <text x="214" y="351" class="muted">输入</text>
      <text x="244" y="351" class="small mono">3.14M</text>
      <rect x="278" y="333" width="70" height="28" rx="6" fill="#101821" stroke="#273241"/>
      <text x="290" y="351" class="muted">缓存</text>
      <text x="320" y="351" class="small mono">2.92M</text>
      <rect x="354" y="333" width="70" height="28" rx="6" fill="#101821" stroke="#273241"/>
