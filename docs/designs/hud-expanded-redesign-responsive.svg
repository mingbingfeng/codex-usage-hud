<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1120" viewBox="0 0 1200 1120">
  <defs>
    <linearGradient id="pageBgR" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080B0F"/>
      <stop offset="0.56" stop-color="#11161D"/>
      <stop offset="1" stop-color="#090D11"/>
    </linearGradient>
    <linearGradient id="cacheFillR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9CCBFF"/>
      <stop offset="1" stop-color="#6F7CF6"/>
    </linearGradient>
    <linearGradient id="dayFillR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F3D27A"/>
      <stop offset="1" stop-color="#E9B75D"/>
    </linearGradient>
    <linearGradient id="weekFillR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B5DD92"/>
      <stop offset="1" stop-color="#75C889"/>
    </linearGradient>
    <linearGradient id="warnFillR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFCF9A"/>
      <stop offset="0.65" stop-color="#FF875A"/>
      <stop offset="1" stop-color="#FF5B64"/>
    </linearGradient>
    <filter id="shadowR" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
    <style>
      .ui { font-family: "Microsoft YaHei UI", "Noto Sans CJK SC", "Segoe UI", sans-serif; }
      .title { fill: #E8EEF7; font-size: 22px; font-weight: 700; }
      .subtitle { fill: #8492A6; font-size: 13px; }
      .label { fill: #A9B6C6; font-size: 12px; font-weight: 700; }
      .muted { fill: #8492A6; font-size: 11px; }
      .small { fill: #B8C6D8; font-size: 11px; }
      .tiny { fill: #8492A6; font-size: 10px; }
      .value { fill: #E8EEF7; font-size: 26px; font-weight: 800; }
      .value2 { fill: #9CCBFF; font-size: 24px; font-weight: 800; }
      .mono { font-family: "Cascadia Mono", "Consolas", monospace; }
      .chipText { fill: #DCE7F2; font-size: 11px; font-weight: 700; }
      .sectionTitle { fill: #CBD8E8; font-size: 13px; font-weight: 800; }
      .accent { fill: #F3D27A; }
      .info { fill: #9CCBFF; }
      .success { fill: #8FE3A1; }
      .warning { fill: #FFB86B; }
      .railText { fill: #FFFFFF; font-size: 12px; font-weight: 800; }
      .railTextDark { fill: #111111; font-size: 12px; font-weight: 800; }
    </style>
  </defs>

  <rect width="1200" height="1120" fill="url(#pageBgR)"/>

  <g class="ui">
    <text x="54" y="48" class="title">顶部 HUD 展开态内容优化 · 响应宽度版</text>
    <text x="54" y="72" class="subtitle">进度条保留现有胶囊轨道样式；宽度变窄时优先保留会话金额、额度进度、当前活动，解释性信息继续隐藏。</text>

    <!-- Codex app background hint -->
    <rect x="54" y="98" width="1092" height="540" rx="10" fill="#181818" stroke="#273241" stroke-opacity="0.55"/>
    <rect x="54" y="98" width="1092" height="38" rx="10" fill="#202020"/>
    <text x="76" y="123" class="muted">≡</text>
    <text x="104" y="123" class="small" font-weight="700">Codex App</text>
